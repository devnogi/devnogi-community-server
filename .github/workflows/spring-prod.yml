name: Spring production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  production:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: devnogi/ci-workflows/.github/workflows/spring-prod.yml@5c46d7aff8ce452b72ad8f6c18bcb5a09828384d
    with:
      service-profile: community-redis
      service-name: community
      dockerfile: Dockerfile
      compose-file: docker-compose-prod.yml
      health-timeout: '300'
      platform: linux/amd64
    secrets: inherit
