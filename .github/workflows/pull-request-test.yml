name: Service verification
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workflow-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test scripts/workflow-contract.test.mjs
  ci:
    needs: workflow-contract
    uses: devnogi/ci-workflows/.github/workflows/spring-ci.yml@c5b33bfa84762986d47037f5ce3eca14a1c516ca
    with:
      service-profile: community-redis
      service-name: community
      dockerfile: Dockerfile
      compose-file: docker-compose-prod.yml
