name: Outfit MySQL verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  outfit-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: outfit-test-only
          MYSQL_DATABASE: outfit_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -poutfit-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify fresh and upgrade migrations and outfit behavior on MySQL
        env:
          TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/outfit_test?useSSL=false&allowPublicKeyRetrieval=true
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: outfit-test-only
        run: bash ./gradlew outfitMysqlTest --no-daemon
