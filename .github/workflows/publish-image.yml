name: Publish community image manually
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle wrapper & dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build (Gradle) & Docker build/tag & Push Docker images
        run: |
          ./gradlew verify --no-daemon
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/devnogi-community-server"

          # 브랜치에 따라 태그 결정 (dev -> dev, main -> latest)
          if [ "${{ github.ref_name }}" == "main" ]; then
            TAG="latest"
          else
            TAG="dev"
          fi
          echo "Building for branch: ${{ github.ref_name }} with tag: ${TAG}"
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/devnogi-community-server:${{ github.sha }} .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/devnogi-community-server:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/devnogi-community-server:latest

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devnogi-community-server:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devnogi-community-server:latest