name: Publish community image manually
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployment-window:
    # 빠른 개선을 위한 dev 브랜치 운영 배포 허용: 2026-12-31까지
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - name: Check temporary dev production window
        if: github.ref == 'refs/heads/dev'
        run: |
          cutoff=$(date -u -d '2026-12-31 15:00:00 UTC' +%s)
          if [ "$(date -u +%s)" -ge "$cutoff" ]; then
            echo 'dev production image publication expired at 2027-01-01 00:00 KST' >&2
            exit 1
          fi
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: deployment-window
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    environment: production

    steps:
      - name: Recheck temporary dev production window after approval
        if: github.ref == 'refs/heads/dev'
        run: |
          cutoff=$(date -u -d '2026-12-31 15:00:00 UTC' +%s)
          if [ "$(date -u +%s)" -ge "$cutoff" ]; then
            echo 'dev production image publication expired at 2027-01-01 00:00 KST' >&2
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle wrapper & dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build (Gradle) & Docker build/tag & Push Docker images
        run: |
          ./gradlew verify --no-daemon
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/devnogi-community-server"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            docker build -t "$IMAGE_NAME:$GITHUB_SHA" .
            docker tag "$IMAGE_NAME:$GITHUB_SHA" "$IMAGE_NAME:latest"
            docker push "$IMAGE_NAME:$GITHUB_SHA"
            docker push "$IMAGE_NAME:latest"
          else
            # dev 이미지는 운영 latest를 덮지 않고 실행 head의 불변 태그만 발행한다.
            IMAGE_TAG="dev-$GITHUB_SHA"
            docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              -t "$IMAGE_NAME:$IMAGE_TAG" .
            cutoff=$(date -u -d '2026-12-31 15:00:00 UTC' +%s)
            if [ "$(date -u +%s)" -ge "$cutoff" ]; then
              echo 'dev production image publication expired before push' >&2
              exit 1
            fi
            docker push "$IMAGE_NAME:$IMAGE_TAG"
          fi
