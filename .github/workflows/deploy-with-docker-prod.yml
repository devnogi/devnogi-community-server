name: Deploy community production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: community-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Require trusted SSH fingerprint
        env:
          HOST_FINGERPRINT: ${{ secrets.PROD_SERVER_SSH_FINGERPRINT }}
        run: test -n "$HOST_FINGERPRINT"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: chmod +x gradlew && ./gradlew verify --no-daemon
      - run: node --test scripts/test-production-workflow.mjs
      - run: node scripts/secret-scan.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - id: image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devnogi-community-server:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Stage deployment configuration
        env:
          SERVICE_PORT: ${{ secrets.PROD_SERVICE_PORT }}
          DB_HOST: ${{ secrets.PROD_DB_HOST }}
          DB_PORT: ${{ secrets.PROD_DB_PORT }}
          DB_SCHEMA: ${{ secrets.PROD_DB_SCHEMA }}
          DB_USER: ${{ secrets.PROD_DB_USER }}
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          REDIS_HOST: ${{ secrets.PROD_REDIS_HOST }}
          REDIS_PORT: ${{ secrets.PROD_REDIS_PORT }}
          REDIS_PASSWORD: ${{ secrets.PROD_REDIS_PASSWORD }}
          JWT_SECRET_KEY: ${{ secrets.PROD_JWT_SECRET_KEY }}
          MINIO_ENDPOINT: ${{ secrets.PROD_MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.PROD_MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.PROD_MINIO_SECRET_KEY }}
          MINIO_BUCKET: ${{ secrets.PROD_MINIO_BUCKET }}
          KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.PROD_KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_CONSUMER_GROUP_ID: ${{ secrets.PROD_KAFKA_CONSUMER_GROUP_ID }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          umask 077
          node scripts/stage-production-env.mjs
      - name: Copy candidate files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          port: ${{ secrets.PROD_SERVER_PORT }}
          fingerprint: ${{ secrets.PROD_SERVER_SSH_FINGERPRINT }}
          source: docker-compose-prod.yml,scripts/deploy-production.sh,.deploy-secrets/.env.candidate,.deploy-secrets/.docker-password
          target: /opt/community/candidate
      - name: Deploy digest and check health
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          port: ${{ secrets.PROD_SERVER_PORT }}
          fingerprint: ${{ secrets.PROD_SERVER_SSH_FINGERPRINT }}
          command_timeout: 15m
          script: |
            set -eu
            cd /opt/community
            umask 077
            trap 'rm -f .env.candidate candidate/.deploy-secrets/.docker-password candidate/.deploy-secrets/.env.candidate' EXIT
            mv candidate/.deploy-secrets/.env.candidate .env.candidate
            docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin < candidate/.deploy-secrets/.docker-password
            export DOCKERHUB_USERNAME='${{ secrets.DOCKERHUB_USERNAME }}'
            export IMAGE_REF='${{ secrets.DOCKERHUB_USERNAME }}/devnogi-community-server@${{ steps.image.outputs.digest }}'
            sh candidate/scripts/deploy-production.sh
      - name: Remove runner deployment configuration
        if: always()
        run: rm -f .deploy-secrets/.env.candidate .deploy-secrets/.docker-password
