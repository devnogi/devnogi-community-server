name: Deploy community production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: community-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: chmod +x gradlew && ./gradlew verify --no-daemon
      - run: node --test scripts/test-production-workflow.mjs
      - run: node scripts/secret-scan.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - id: image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devnogi-community-server:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Copy candidate compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          port: ${{ secrets.PROD_SERVER_PORT }}
          source: docker-compose-prod.yml
          target: /opt/community/candidate
      - name: Deploy digest and check health
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          port: ${{ secrets.PROD_SERVER_PORT }}
          script: |
            set -eu
            cd /opt/community
            umask 077
            echo "SERVICE_PORT=${{ secrets.PROD_SERVICE_PORT }}" > .env.prod
            echo "DB_HOST=${{ secrets.PROD_DB_HOST }}" >> .env.prod
            echo "DB_PORT=${{ secrets.PROD_DB_PORT }}" >> .env.prod
            echo "DB_SCHEMA=${{ secrets.PROD_DB_SCHEMA }}" >> .env.prod
            echo "DB_USER=${{ secrets.PROD_DB_USER }}" >> .env.prod
            echo "DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}" >> .env.prod
            echo "REDIS_HOST=${{ secrets.PROD_REDIS_HOST }}" >> .env.prod
            echo "REDIS_PORT=${{ secrets.PROD_REDIS_PORT }}" >> .env.prod
            echo "REDIS_PASSWORD=${{ secrets.PROD_REDIS_PASSWORD }}" >> .env.prod
            echo "JWT_SECRET_KEY='${{ secrets.PROD_JWT_SECRET_KEY }}'" >> .env.prod
            echo "MINIO_ENDPOINT=${{ secrets.PROD_MINIO_ENDPOINT }}" >> .env.prod
            echo "MINIO_ACCESS_KEY=${{ secrets.PROD_MINIO_ACCESS_KEY }}" >> .env.prod
            echo "MINIO_SECRET_KEY=${{ secrets.PROD_MINIO_SECRET_KEY }}" >> .env.prod
            echo "MINIO_BUCKET=${{ secrets.PROD_MINIO_BUCKET }}" >> .env.prod
            echo "KAFKA_BOOTSTRAP_SERVERS=${{ secrets.PROD_KAFKA_BOOTSTRAP_SERVERS }}" >> .env.prod
            echo "KAFKA_CONSUMER_GROUP_ID=${{ secrets.PROD_KAFKA_CONSUMER_GROUP_ID }}" >> .env.prod
            printf '%s' '${{ secrets.DOCKERHUB_PASSWORD }}' | docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin
            IMAGE_REF='${{ secrets.DOCKERHUB_USERNAME }}/devnogi-community-server@${{ steps.image.outputs.digest }}'
            case "$IMAGE_REF" in *@sha256:*) ;; *) echo 'Invalid image digest' >&2; exit 1 ;; esac
            export IMAGE_REF
            docker pull "$IMAGE_REF"
            old_id=$(docker inspect --format '{{.Image}}' devnogi-community-server 2>/dev/null || true)
            old_ref=''
            if [ -n "$old_id" ]; then old_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$old_id" 2>/dev/null || true); fi
            case "$old_ref" in *@sha256:*) ;; *) old_ref='' ;; esac
            previous_compose=false
            if [ -f docker-compose-prod.yml ]; then cp docker-compose-prod.yml .previous-compose.yml; previous_compose=true; fi
            cp candidate/docker-compose-prod.yml docker-compose-prod.yml
            rollback() {
              if [ -z "$old_ref" ]; then echo 'No previous immutable image; automatic rollback unavailable' >&2; return 1; fi
              if [ "$previous_compose" != true ]; then echo 'Previous compose unavailable' >&2; return 1; fi
              printf 'services:\n  backend:\n    image: %s\n' "$old_ref" > .rollback-image.yml
              if ! IMAGE_REF="$old_ref" DOCKERHUB_USERNAME='${{ secrets.DOCKERHUB_USERNAME }}' DOCKER_IMAGE_TAG=latest docker compose -f .previous-compose.yml -f .rollback-image.yml --env-file .env.prod up -d --no-deps backend; then
                echo 'Rollback failed' >&2
                return 1
              fi
              cp .previous-compose.yml docker-compose-prod.yml
            }
            if ! docker compose -f docker-compose-prod.yml --env-file .env.prod up -d --no-deps backend; then rollback || true; exit 1; fi
            healthy=false
            for attempt in $(seq 1 60); do
              if curl -fsS "http://127.0.0.1:${{ secrets.PROD_SERVICE_PORT }}/actuator/health" | grep -q '"status":"UP"'; then healthy=true; break; fi
              sleep 5
            done
            if [ "$healthy" != true ]; then rollback || true; exit 1; fi
            if [ -n "$old_ref" ]; then printf '%s\n' "$old_ref" > .previous-image-ref; fi
            printf '%s\n' "$IMAGE_REF" > .last-deployed-image-ref
