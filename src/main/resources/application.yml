server:
  port: 8093
  address: 0.0.0.0
  shutdown: graceful
  error:
    whitelabel:
      enabled: false
  tomcat:
    mbeanregistry:
      enabled: true

#로컬용 설정
minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:dcs-local-bucket}


management:
  endpoints:
    web:
      exposure:
        include: [ "health" ]
  health:
    db:
      enabled: false
    redis:
      enabled: false

spring:
  application:
    name: devnogi-community-server
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 27MB
  docker:
    compose:
      file: docker-compose-local.yaml
  web:
    resources:
      static-locations: classpath:/static/
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT}/${DB_SCHEMA}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
  #    show-sql: true
  flyway:
    enabled: true
    encoding: UTF-8
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  mvc:
    contentnegotiation:
      # URL 확장자에 의한 컨텐트 타입 결정
      favor-path-extension: true
      # Accept 헤더 무시
      ignore-accept-header: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  cache:
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: false

springdoc:
  swagger-ui:
    persist-authorization: true
    operations-sorter: alpha
    tags-sorter: alpha
    disable-swagger-default-url: true
    display-request-duration: true
    classification:
      readyToUseGroupName: 개발 완료 API
      workInProgressGroupName: 개발 진행중 API
      deprecatedGroupName: 더이상 유지보수되지 않는 API

decorator:
  datasource:
    p6spy:
      enable-logging: false

outfit:
  catalog:
    base-url: ${OUTFIT_CATALOG_BASE_URL:http://localhost:8090/oab}
    warmup-enabled: ${OUTFIT_CATALOG_WARMUP_ENABLED:true}
    warmup-interval-ms: 3600000

app:
  notification:
    stream: notif-stream
    group: notif-workers
    pollTimeoutSec: 30        # 블로킹 대기 시간 (롱폴링)
    maxLen: 100000            # 스트림 길이

experience:
  capture-enabled: ${EXPERIENCE_CAPTURE_ENABLED:false}
  publish-enabled: ${EXPERIENCE_PUBLISH_ENABLED:false}
  publish-delay-ms: 1000

---
# 로컬 개발 환경
spring:
  config:
    activate:
      on-profile: local
  kafka:
    bootstrap-servers: kafka:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
    consumer:
      group-id: devnogi-community-group
      auto-offset-reset: latest

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer

decorator:
  datasource:
    p6spy:
      enable-logging: true

logging:
  level:
    until.the.eternity: DEBUG
    until.the.eternity.dcs.common.filter: DEBUG


---
# 운영 환경
spring:
  config:
    activate:
      on-profile: prod
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6389}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:devnogi-community-group}
      auto-offset-reset: latest

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer

springdoc:
  swagger-ui:
    enabled: false

minio:
  url: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:dcs-local-bucket}



decorator:
  datasource:
    p6spy:
      enable-logging: false

logging:
  level:
    root: INFO
    until.the.eternity: INFO
    org.springframework.kafka: WARN
    org.apache.kafka: WARN
    org.springframework.data.redis: WARN
    io.lettuce.core: WARN

---
# Docker 환경
spring:
  config:
    activate:
      on-profile: docker  # 전체를 Docker로 실행할 때
  data:
    redis:
      host: ${REDIS_HOST:devnogi-community-redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:devnogi-community-group}
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
logging:
  level:
    root: INFO
    until.the.eternity: INFO
    org.springframework.kafka: INFO
